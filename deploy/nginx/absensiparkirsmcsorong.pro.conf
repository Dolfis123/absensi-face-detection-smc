# SMC-FaceAttend — Nginx (HTTP). Certbot akan menambahkan blok HTTPS + redirect otomatis.
server {
    listen 80;
    listen [::]:80;
    server_name absensiparkirsmcsorong.pro www.absensiparkirsmcsorong.pro;

    root /var/www/smc/frontend/dist;
    index index.html;

    # Pendaftaran wajah mengirim sampai 5 foto sekaligus
    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # REST API (Express, hanya mendengarkan di 127.0.0.1:4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pendaftaran wajah (10 jitter x 5 foto) bisa makan waktu lama
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # File hasil build Vite memakai nama ber-hash, aman di-cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplikasi React (SPA): semua rute dikembalikan ke index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
